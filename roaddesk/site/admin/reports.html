<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Filter, search and open every road issue report.">
<link rel="canonical" href="https://YOURDOMAIN.in/admin/reports.html">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12161b">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/images/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="RoadDesk">
<meta property="og:title" content="All reports | RoadDesk staff">
<meta property="og:description" content="Filter, search and open every road issue report.">
<meta property="og:url" content="https://YOURDOMAIN.in/admin/reports.html">
<meta property="og:image" content="https://YOURDOMAIN.in/images/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="RoadDesk: road issue reporting for municipalities">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="gated">
<a class="skip-link" href="#main">Skip to main content</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/index.html"><span class="brand-mark" aria-hidden="true"></span><span>RoadDesk</span></a>
    <nav aria-label="Main">
      <ul class="nav-list">
        <li><a href="/report.html">Report an issue</a></li>
        <li data-show="user" hidden><a href="/my-reports.html">My reports</a></li>
        <li data-show="admin" hidden><a href="/admin/index.html">Staff area</a></li>
        <li data-show="guest" hidden><a href="/login.html">Log in</a></li>
        <li data-show="guest" hidden><a href="/register.html">Create account</a></li>
        <li data-show="user" hidden><button type="button" class="link-btn" id="logout-btn">Log out</button></li>
      </ul>
    </nav>
  </div>
</header>
<noscript><p class="msg error container">RoadDesk needs JavaScript to log you in and show reports. Turn JavaScript on and reload the page.</p></noscript>
<main id="main">
<div class="container section">
  <h1>All reports</h1>
  <nav class="subnav" aria-label="Staff area"><a href="/admin/index.html">Dashboard</a><a href="/admin/reports.html" aria-current="page">All reports</a><a href="/admin/map.html">Map</a></nav>
  <div class="glass panel">
    <div class="filters">
      <div class="field"><label for="f-q">Search</label><input id="f-q" type="search" maxlength="100" placeholder="Title or address"></div>
      <div class="field"><label for="f-status">Status</label><select id="f-status"></select></div>
      <div class="field"><label for="f-severity">Severity</label><select id="f-severity"></select></div>
      <div class="field"><label for="f-category">Category</label><select id="f-category"></select></div>
      <div class="field"><label for="f-sort">Sort by</label><select id="f-sort"><option value="newest">Newest first</option><option value="severity">Severity, then newest</option></select></div>
    </div>
    <p id="result-info" class="muted" aria-live="polite">Loading</p>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th scope="col">Title</th><th scope="col">Category</th><th scope="col">Severity</th><th scope="col">Status</th><th scope="col">Address</th><th scope="col">Reported</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p style="margin-top:1rem"><button type="button" id="more-btn" class="btn btn-secondary" hidden>Show more</button></p>
  </div>
</div>
</main>
<footer class="site-footer">
  <div class="container footer-inner">
    <p>&copy; 2026 {{OPERATOR_NAME}}</p>
    <ul>
      <li><a href="/privacy.html">Privacy policy</a></li>
      <li><a href="/terms.html">Terms and conditions</a></li>
      <li><button type="button" class="link-btn" id="cookie-settings">Cookie settings</button></li>
      <li><a href="mailto:{{CONTACT_EMAIL}}">Contact</a></li>
    </ul>
  </div>
</footer>
<script src="/vendor/supabase.js" defer></script>
<script src="/js/config.js" defer></script>
<script src="/js/common.js" defer></script>
<script src="/js/consent.js" defer></script>
<script src="/js/admin-reports.js" defer></script>
</body>
</html>
